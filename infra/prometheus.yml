global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: [/etc/prometheus/alerts.yml]

scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:3001"] }]
  - job_name: market-data
    static_configs: [{ targets: ["market-data:9105"] }]
  - job_name: indexer
    static_configs: [{ targets: ["indexer:42069"] }]
  - job_name: agent
    static_configs: [{ targets: ["agent:3002"] }]
  - job_name: keepers
    static_configs:
      - targets: ["price-pusher:9101", "rebalance-trigger:9102", "auction-filler:9103", "auto-fund:9114"]
  - job_name: monitor
    scrape_interval: 60s
    static_configs: [{ targets: ["monitor:9110"] }]
